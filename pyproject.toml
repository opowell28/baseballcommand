[project]
name = "baseballcommand"
version = "0.1.0"
description = "This is a tool that will retrieve Major League Baseball scores and stats."
authors = [
    {name = "Owen Powell",email = "opowell2899@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argparse (>=1.4.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry.scripts]
base = "baseballcommand:cli" # CLI entry point

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
